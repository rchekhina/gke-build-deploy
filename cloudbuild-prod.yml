steps:
  # 1. Crear el Release global en Cloud Deploy
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'deploy'
      - 'releases'
      - 'create'
      - 'rel-prod-$SHORT_SHA-$BUILD_NUMBER'
      - '--delivery-pipeline=mi-pipeline-gke'
      - '--region=us-central1'
      - '--skaffold-file=skaffold.yml'

options:
  logging: CLOUD_LOGGING_ONLY
