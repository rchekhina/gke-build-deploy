steps:
  # 1. Crear el Release global activando el perfil de producción
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'deploy'
      - 'releases'
      - 'create'
      - 'rel-prod-$SHORT_SHA-$BUILD_ID'
      - '--delivery-pipeline=mi-pipeline-gke'
      - '--region=us-central1'
      - '--skaffold-file=skaffold.yml'
      - '--config-changes=profiles=produccion' # 🚀 Activa el perfil de producción en Skaffold

options:
  logging: CLOUD_LOGGING_ONLY
