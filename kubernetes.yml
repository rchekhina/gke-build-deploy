apiVersion: apps/v1
kind: Deployment
metadata:
  name: mi-app-deployment
  labels:
    app: mi-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mi-app
  template:
    metadata:
      labels:
        app: mi-app
    spec:
      containers:
      - name: app-container
        image: mi-app # 👈 Skaffold cambiará esto por la URL completa del perfil activo + el tag único
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "200m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: mi-app-service
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: mi-app
